<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GameHub Academy | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body class="auth-page">
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="login.html">🎮 GameHub Academy</a>
        <button class="btn btn-outline-light btn-sm theme-toggle" type="button" data-theme-toggle>🌙 Dark mode</button>
      </div>
    </nav>

    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
      <section class="row login-card shadow-lg overflow-hidden fade-in" aria-label="Área de login">
        <div class="col-lg-6 p-0 d-none d-lg-block">
          <img class="login-image" src="assets/img/login-hero.svg" alt="Jogadores em uma plataforma digital de games">
        </div>
        <div class="col-lg-6 p-4 p-md-5 bg-panel">
          <span class="badge text-bg-primary mb-3">Projeto Front-End 2º Bimestre</span>
          <h1 class="display-6 fw-bold mb-2">Entre no painel</h1>
          <p class="text-secondary mb-4">Use o usuário fixo <strong>adm</strong> e a senha <strong>123</strong> para acessar as telas protegidas.</p>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="usuario" class="form-label">Usuário</label>
              <input class="form-control" id="usuario" name="usuario" type="text" autocomplete="username" required>
              <div class="invalid-feedback">Informe o usuário.</div>
            </div>
            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input class="form-control" id="senha" name="senha" type="password" autocomplete="current-password" required minlength="3">
              <div class="invalid-feedback">Informe uma senha com pelo menos 3 caracteres.</div>
            </div>
            <p id="loginMessage" class="small text-danger" role="alert" aria-live="polite"></p>
            <button class="btn btn-primary w-100 btn-lg" type="submit">Acessar sistema</button>
          </form>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
